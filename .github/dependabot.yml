# Dependabot version updates. Every label used below must exist in the repo:
# Dependabot doesn't create them, and silently leaves them off the PR.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
# This file is Seed, so it belongs to the repo: add its other ecosystems (such
# as npm for a pnpm project) and its own ignores here.
---

version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    # Conventional commits, like the repo's own: "chore(deps): bump ...".
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "github-actions"
      - "dependencies"
    groups:
      all-actions:
        patterns:
          - "*"

  # Maintain dependencies for nuget
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    # Conventional commits, like the repo's own: "chore(deps): bump ...".
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.x requires Microsoft.OpenApi < 3.0.0,
      # so a 3.x bump breaks restore. Drop this once ASP.NET allows 3.x.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
    labels:
      - "nuget"
      - "dependencies"
    groups:
      # Testcontainers modules only work with the matching core version,
      # so they always move together. A dependency joins the first group
      # that matches it, so this group stays ahead of all-nuget.
      testcontainers:
        patterns:
          - "Testcontainers*"
      all-nuget:
        patterns:
          - "*"

  # Maintain DotNet Sdk
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    # Conventional commits, like the repo's own: "chore(deps): bump ...".
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dotnet-sdk"
      - "dependencies"
    groups:
      dotnet-sdk:
        patterns:
          - "*"

  # Maintain the root pnpm packages (Sandcastle and Zod, for .sandcastle/)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    # Conventional commits, like the repo's own: "chore(deps): bump ...".
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "npm"
      - "dependencies"
    groups:
      all-npm:
        patterns:
          - "*"

  # Maintain the web project's pnpm packages (Tailwind CLI)
  - package-ecosystem: "npm"
    directory: "/src/Web"
    target-branch: "main"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:00"
    open-pull-requests-limit: 10
    # Wait a week before proposing a new release, so a compromised or broken
    # one is usually caught upstream before it reaches a PR here.
    cooldown:
      default-days: 7
    # Conventional commits, like the repo's own: "chore(deps): bump ...".
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "npm"
      - "dependencies"
    groups:
      all-npm:
        patterns:
          - "*"

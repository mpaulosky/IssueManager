---
name: PR Auto-Merge

# Squash-merges a same-repo PR into main once it is ready: required checks
# pass, Copilot has reviewed the PR's head commit, and every review thread is
# resolved. The decision is .github/scripts/automerge-decision.mjs, tested by
# automerge-tests.yml. Each trigger below is a moment one of those conditions
# can become true; the job re-checks all of them every time.
# zizmor flags pull_request_target and workflow_run as dangerous because they
# run with write access on PR events. That is safe here: neither path checks
# out or executes PR code, as the comments below explain.
"on":  # zizmor: ignore[dangerous-triggers]
  # pull_request_target, not pull_request: it runs this file as it is on
  # main, so a PR can't edit the script that decides whether it merges or
  # reach the PAT. The job checks out only main's .github/scripts.
  pull_request_target:
    types: [opened, ready_for_review, reopened, edited, synchronize]
    branches: [main]
  # GitHub sends no check_suite events for suites created by Actions, and
  # every required check comes from one of these workflows, so their
  # completion is the signal that the checks may have gone green.
  workflow_run:
    workflows: ["Build and Test Suite", "Lint Markdown", "Lint YAML", "Lint Actions", "CodeQL"]
    types: [completed]
  # Resolving a review thread has no Actions trigger, and pull_request_review
  # would run the PR's own copy of this file with write access, so a PR whose
  # last blocker was a review or an open thread is picked up by this sweep.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-when-ready:
    name: Merge same-repo PRs when ready
    # A manual sweep can merge every ready PR, so it runs only from main.
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      # Only for .github/scripts/automerge-decision.mjs. Every trigger checks
      # out main here (pull_request_target's default ref is the base branch),
      # never the PR's head.
      - name: Checkout decision module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Squash-merge when ready
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          # A merge made with GITHUB_TOKEN is attributed to github-actions,
          # and GitHub starts no workflows from it: the release workflow, its
          # release-blog PR and "Closes #N" all silently skip. Merging with the
          # PAT attributes the merge to a real user.
          github-token: ${{ secrets.RELEASE_PR_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { decideAutoMerge } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/automerge-decision.mjs`
            );
            const { owner, repo } = context.repo;

            async function mergeIfReady(pullNumber) {
              const status = await github.graphql(
                `query MergeReadiness(
                   $owner: String!,
                   $repo: String!,
                   $number: Int!
                 ) {
                   repository(owner: $owner, name: $repo) {
                     pullRequest(number: $number) {
                       state
                       merged
                       isDraft
                       isCrossRepository
                       baseRefName
                       headRefOid
                       mergeable
                       mergeStateStatus
                       autoMergeRequest {
                         enabledAt
                       }
                       # Filtering by author keeps other reviews (each thread
                       # reply counts as one) from pushing Copilot's off the
                       # page. The filter takes the "[bot]" login.
                       copilotReviews: reviews(last: 20, author: "copilot-pull-request-reviewer[bot]") {
                         nodes {
                           commit { oid }
                         }
                       }
                       reviewThreads(first: 100) {
                         totalCount
                         nodes { isResolved }
                       }
                     }
                   }
                 }`,
                { owner, repo, number: pullNumber }
              );

              const pr = status.repository.pullRequest;
              if (!pr || pr.baseRefName !== "main") {
                core.info(`Skipping PR #${pullNumber}: not a PR into main.`);
                return;
              }

              const decision = decideAutoMerge({
                state: pr.state,
                merged: pr.merged,
                isDraft: pr.isDraft,
                isSameRepo: !pr.isCrossRepository,
                mergeable: pr.mergeable,
                mergeStateStatus: pr.mergeStateStatus,
                autoMergeEnabled: pr.autoMergeRequest !== null,
                copilotReviewedHead: pr.copilotReviews.nodes.some(
                  (review) => review.commit?.oid === pr.headRefOid
                ),
                unresolvedThreads: pr.reviewThreads.nodes.filter((thread) => !thread.isResolved).length,
                threadsTruncated: pr.reviewThreads.totalCount > pr.reviewThreads.nodes.length,
              });

              if (decision.action !== "merge") {
                core.info(`${decision.action === "wait" ? "Waiting on" : "Skipping"} PR #${pullNumber}: ${decision.reason}.`);
                return;
              }

              try {
                // sha pins the merge to the commit that was checked above, so
                // a push that lands in between makes the merge fail instead of
                // merging unreviewed code.
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pullNumber,
                  sha: pr.headRefOid,
                  merge_method: "squash"
                });
              } catch (error) {
                // 405: not mergeable after all (e.g. a parallel run just
                // merged it); 409: the head moved. A later event re-evaluates.
                if (error.status === 405 || error.status === 409) {
                  core.warning(`Not merging PR #${pullNumber}: ${error.message}`);
                  return;
                }
                throw error;
              }

              core.info(`Squash-merged PR #${pullNumber} at ${pr.headRefOid} (${decision.reason}).`);
            }

            // pull_request_target events carry the PR; workflow_run carries
            // only a commit; schedule and workflow_dispatch sweep every open
            // PR into main.
            let pullNumbers = [];
            const workflowRun = context.payload.workflow_run;
            if (context.payload.pull_request) {
              pullNumbers = [context.payload.pull_request.number];
            } else if (workflowRun) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: workflowRun.head_sha
              });
              pullNumbers = associated.data
                .filter((pr) => pr.state === "open" && pr.head?.sha === workflowRun.head_sha)
                .map((pr) => pr.number);
            } else {
              const open = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                base: "main",
                per_page: 100
              });
              pullNumbers = open.map((pr) => pr.number);
            }

            if (pullNumbers.length === 0) {
              core.info("No open pull request to evaluate for this event.");
              return;
            }

            for (const pullNumber of pullNumbers) {
              await mergeIfReady(pullNumber);
            }

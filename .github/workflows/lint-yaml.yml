---
name: Lint YAML
# Validates all workflow and config YAML files

"on":
  push:
    branches: [dev, insider]
    paths: ["**.yml", "**.yaml"]
  pull_request:
    branches: [dev, preview, main, insider]
    paths: ["**.yml", "**.yaml"]

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yml

---
name: Lint YAML
# Validates all workflow and config YAML files

"on":
  push:
    branches: [dev, insider]
    paths: ["**.yml", "**.yaml"]
  pull_request:
    branches: [dev, preview, main, insider]
    paths: ["**.yml", "**.yaml"]

permissions:
  contents: read

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Collect changed YAML files
        id: changed-yaml
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            mapfile -t files < <(
              git diff --name-only \
                "origin/${{ github.base_ref }}...HEAD" \
                -- '*.yml' '*.yaml'
            )
          else
            mapfile -t files < <(
              git diff --name-only \
                "${{ github.event.before }}" \
                HEAD \
                -- '*.yml' '*.yaml'
            )
          fi

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${files[@]}" > changed-yaml-files.txt
          echo "has_files=true" >> "$GITHUB_OUTPUT"

      - name: Run yamllint
        if: steps.changed-yaml.outputs.has_files == 'true'
        shell: bash
        run: |
          python -m pip install --quiet yamllint
          mapfile -t files < changed-yaml-files.txt
          yamllint -s -c .yamllint.yml "${files[@]}"

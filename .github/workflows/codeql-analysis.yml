# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
---
name: "CodeQL"

"on":
  push:
    branches:
      - main
    paths:
      - "**.cs"
      - "**.csproj"

  pull_request:
    branches:
      - "**"

  workflow_dispatch:
    inputs:
      reason:
        description: "The reason for running the workflow"
        required: true
        default: "Manual run"

  schedule:
    - cron: "31 0 * * 5"

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["csharp"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Discover solution file
        run: |
          mapfile -t matches < <(find . -maxdepth 1 -name '*.slnx')
          count=${#matches[@]}
          if [[ $count -eq 0 ]]; then
            echo "::error::No *.slnx file found at the repository root."
            exit 1
          elif [[ $count -gt 1 ]]; then
            echo "::error::Multiple *.slnx files found"
            echo "::error::${matches[*]}"
            exit 1
          fi
          echo "SOLUTION_FILE=${matches[0]}" >> "$GITHUB_ENV"
          echo "Discovered solution: ${matches[0]}"

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_FILE"

      - name: Build solution
        run: dotnet build "$SOLUTION_FILE" --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

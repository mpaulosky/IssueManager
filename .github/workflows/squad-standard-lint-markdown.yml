---
name: lint-markdown

"on":
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !**/node_modules/**
            !**/bin/**
            !**/obj/**
            !.squad/**
            !.copilot/**
            !.github/agents/**
            !.github/skills/**
            !.github/copilot-instructions.md
          config: ".markdownlint.json"
